# GitHub Action for generating a contribution graph with a snake eating your contributions.
name: Generate github stats

# Controls when the action will run.
on:
  schedule:
      # Runs at 30 minutes past the hour, every 5 hours
    - cron: "0 */5 * * *"
    
  # This command allows us to run the Action automatically from the Actions tab.
  workflow_dispatch:
  
  # Also run on every push on the master branch
  push:
    branches:
    - main
permissions:
  contents: write
# The sequence of runs in this workflow:
jobs:
  # This workflow contains a single job called "build"
  update-stats:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Clone repo
        uses: actions/checkout@v3
    
      - name: Generate the snake files in './dist/'
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=red&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show build status
        run: git status

      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update contribution timeline snake animations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: update waka time
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_COMMIT: true
          SHOW_TIMEZONE: true
          SHOW_EDITORS: true
          SHOW_DAYS_OF_WEEK: false
          SHOW_PROJECTS: false
          SHOW_UPDATED_DATE: false
          SHOW_LOC_CHART: false
          SHOW_PROFILE_VIEWS: false
          SHOW_LINES_OF_CODE: true
